# Purpose: Expose serverless-llm service internally (ClusterIP) and externally for demos (NodePort).
apiVersion: v1
kind: Service
metadata:
  name: serverless-llm-clusterip
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: serverless-llm
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: serverless-llm-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: serverless-llm
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
